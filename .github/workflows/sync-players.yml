name: Sync NBA players.json

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"  # каждый день 03:17 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate public/players.json (500+ active)
        run: |
          python - << 'PY'
          import json, sys, os, requests
          # --- весь твой код генератора тут (как я присылал ранее) ---
          # см. предыдущее сообщение — блок fetch_commonallplayers/parse_rows/... и запись public/players.json
          # ВАЖНО: оставь print("wrote public/players.json with ...")
          PY

      - name: Commit & push
        run: |
          if [ -n "$(git status --porcelain public/players.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/players.json
            git commit -m "chore: update players.json ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
            git push
          else
            echo "No changes in players.json"
