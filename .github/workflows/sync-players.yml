name: Sync NBA active players → assets/players.json

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * *"  # ежедневно 05:17 по Москве / 04:17 по Хельсинки

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BL_API_KEY: ${{ secrets.BL_API_KEY }}
      GIT_AUTHOR_NAME: "bot"
      GIT_AUTHOR_EMAIL: "bot@users.noreply.github.com"
      GIT_COMMITTER_NAME: "bot"
      GIT_COMMITTER_EMAIL: "bot@users.noreply.github.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests Unidecode

      - name: Build assets/players.json
        run: |
          python scripts/build_players.py

      - name: Commit changes (if any)
        run: |
          if git status --porcelain | grep -q "assets/players.json"; then
            git add assets/players.json
            git commit -m "chore: sync players.json from balldontlie + NBA IDs"
            git push
          else
            echo "No changes in assets/players.json"
          fi
