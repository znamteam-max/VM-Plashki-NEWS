name: Sync NBA players.json

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"  # раз в день 03:17 UTC

permissions:
  contents: write  # даём прав на push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate public/players.json (500+ active)
        shell: bash
        run: |
          python - << 'PY'
          import json, os, requests

          def fetch_commonallplayers(season):
              url = f"https://stats.nba.com/stats/commonallplayers?LeagueID=00&Season={season}&IsOnlyCurrentSeason=1"
              headers = {
                  "Host": "stats.nba.com",
                  "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                 "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"),
                  "Referer": "https://www.nba.com/",
                  "Origin": "https://www.nba.com",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "Connection": "keep-alive",
                  "x-nba-stats-origin": "stats",
                  "x-nba-stats-token": "true",
                  "Accept-Encoding": "gzip, deflate",
                  "Sec-Fetch-Site": "same-site",
                  "Sec-Fetch-Mode": "cors",
                  "Sec-Fetch-Dest": "empty",
                  "sec-ch-ua": '"Chromium";v="124", "Google Chrome";v="124", ";Not A Brand";v="24"',
                  "sec-ch-ua-mobile": "?0",
                  "sec-ch-ua-platform": '"Windows"',
              }
              r = requests.get(url, headers=headers, timeout=20)
              r.raise_for_status()
              return r.json()

          def parse_rows(j):
              rs = None
              if isinstance(j.get("resultSets"), list) and j["resultSets"]:
                  rs = j["resultSets"][0]
              elif isinstance(j.get("resultSet"), dict):
                  rs = j["resultSet"]
              if not rs:
                  return []
              headers = rs.get("headers") or []
              rows    = rs.get("rowSet") or []
              idx = {h:i for i,h in enumerate(headers)}
              need = ("PERSON_ID","FIRST_NAME","LAST_NAME","TEAM_ID","ROSTERSTATUS")
              if not all(k in idx for k in need):
                  return []
              out = []
              for row in rows:
                  try:
                      pid   = str(row[idx["PERSON_ID"]])
                      first = (row[idx["FIRST_NAME"]] or "").strip()
                      last  = (row[idx["LAST_NAME"]]  or "").strip()
                      team  = str(row[idx["TEAM_ID"]] or "0")
                      active = int(row[idx["ROSTERSTATUS"]] or 0) == 1
                      if active:
                          out.append((pid, first, last, team))
                  except Exception:
                      continue
              return out

          seasons = ["2025-26","2024-25","2023-24"]
          seen, standard = set(), []
          for s in seasons:
              try:
                  for pid, first, last, team in parse_rows(fetch_commonallplayers(s)):
                      if pid in seen:
                          continue
                      seen.add(pid)
                      standard.append({"personId": pid, "firstName": first, "lastName": last, "teamId": team})
              except Exception as e:
                  print(f"[sync] season {s} error: {type(e).__name__}: {e}", flush=True)

          os.makedirs("public", exist_ok=True)
          with open("public/players.json","w",encoding="utf-8") as f:
              json.dump({"league":{"standard":standard}}, f, ensure_ascii=False, separators=(",",":"))
          print(f"[sync] wrote public/players.json with {len(standard)} active players")
          PY

      - name: Commit & push (only if changed)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes in public/players.json"
          else
            git commit -m "chore: update players.json ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
            git push
          fi
